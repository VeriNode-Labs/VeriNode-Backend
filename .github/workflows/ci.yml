name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  TEST_SHARDS: 4

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      workflows: ${{ steps.filter.outputs.workflows }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
              - 'scripts/**'
              - 'pre-commit.d/**'
              - '.gitattributes'
              - 'Dockerfile'
            workflows:
              - '.github/workflows/**'
            docs:
              - '**/*.md'

  install-cache:
    name: Warm dependency cache
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Restore node_modules (shared registry cache)
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

  build:
    name: TypeScript build
    runs-on: ubuntu-latest
    needs: [changes, install-cache]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
      - name: Restore per-branch build output
        id: dist-cache
        uses: actions/cache/restore@v6
        with:
          path: dist
          key: dist-${{ runner.os }}-${{ github.ref }}-${{ hashFiles('src/**', 'tsconfig.json') }}
          restore-keys: |
            dist-${{ runner.os }}-${{ github.ref }}-
      - name: Build
        run: npm run build
      - name: Save per-branch build output
        if: steps.dist-cache.outputs.cache-hit != 'true' && success()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: dist
          key: dist-${{ runner.os }}-${{ github.ref }}-${{ hashFiles('src/**', 'tsconfig.json') }}

  test:
    name: Test shard ${{ matrix.shard }} of ${{ env.TEST_SHARDS }}
    runs-on: ubuntu-latest
    needs: [changes, install-cache]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
      - name: Run test shard
        run: node scripts/shard-tests.cjs --shard ${{ matrix.shard }} --total ${{ env.TEST_SHARDS }}

  pre-commit:
    name: Pre-commit hook checks
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate CI workflow contract
        run: node scripts/validate-ci-workflow.cjs
      - name: Run pre-commit hooks on all files
        run: |
          # Simulate pre-commit against all tracked files (CI equivalent).
          # Lint/format hooks self-skip when their tools are not installed;
          # this whole job is skipped for docs-only changes via paths-filter.
          for hook in pre-commit.d/*.sh; do
            [ -f "$hook" ] || continue
            echo "--- Running $(basename "$hook" .sh) ---"
            sh "$hook" || exit 1
          done
          echo "All pre-commit hooks passed"

  security:
    name: Security review gates
    runs-on: ubuntu-latest
    needs: [changes, install-cache]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level high
      - name: CodeQL init
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3

  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image with registry cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  timings:
    name: CI timing report
    runs-on: ubuntu-latest
    needs: [build, test, pre-commit, security, docker]
    if: always()
    steps:
      - name: Report job durations
        shell: bash
        env:
          BUILD_STARTED: ${{ needs.build.startedAt }}
          BUILD_COMPLETED: ${{ needs.build.completedAt }}
          TEST_STARTED: ${{ needs.test.startedAt }}
          TEST_COMPLETED: ${{ needs.test.completedAt }}
          PRE_COMMIT_STARTED: ${{ needs.pre-commit.startedAt }}
          PRE_COMMIT_COMPLETED: ${{ needs.pre-commit.completedAt }}
          SECURITY_STARTED: ${{ needs.security.startedAt }}
          SECURITY_COMPLETED: ${{ needs.security.completedAt }}
          DOCKER_STARTED: ${{ needs.docker.startedAt }}
          DOCKER_COMPLETED: ${{ needs.docker.completedAt }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime

          jobs = ['build', 'test', 'pre-commit', 'security', 'docker']
          lines = ['## CI job durations (seconds)']
          for job in jobs:
              key = job.replace('-', '_').upper()
              started = os.environ.get(f'{key}_STARTED') or ''
              completed = os.environ.get(f'{key}_COMPLETED') or ''
              if not started or not completed:
                  lines.append(f'- {job}: skipped')
                  continue
              try:
                  start = datetime.fromisoformat(started.replace('Z', '+00:00'))
                  end = datetime.fromisoformat(completed.replace('Z', '+00:00'))
                  lines.append(f'- {job}: {int((end - start).total_seconds())}s')
              except ValueError:
                  lines.append(f'- {job}: unknown')
          with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a') as f:
              f.write('\n'.join(lines) + '\n')
          PY

  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    needs: [changes, build, test, pre-commit, security, docker]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          echo "build=${{ needs.build.result }}"
          echo "test=${{ needs.test.result }}"
          echo "security=${{ needs.security.result }}"
          echo "docker=${{ needs.docker.result }}"

          for result in "${{ needs.build.result }}" "${{ needs.test.result }}" "${{ needs.security.result }}" "${{ needs.docker.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required CI job finished with status: $result"
              exit 1
            fi
          done
