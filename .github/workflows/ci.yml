name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.23.0'

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      workflows: ${{ steps.filter.outputs.workflows }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
              - 'scripts/**'
              - 'Dockerfile'
            workflows:
              - '.github/workflows/**'
            docs:
              - '**/*.md'

  install-cache:
    name: Warm dependency cache
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  build:
    name: TypeScript build
    runs-on: ubuntu-latest
    needs: [changes, install-cache]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build

  test:
    name: Test shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [changes, install-cache]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: workflow-contract
            command: pnpm run ci:validate-workflow
          - shard: queue-monitoring
            command: node --check scripts/run-tests.cjs
          - shard: queue-autoscaling
            command: node -e "const fs=require('fs'); const d=fs.readFileSync('docs/operations/github-actions-optimization.md','utf8'); if(!d.includes('P99 latency remains below 100 ms')) process.exit(1);"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run shard
        run: ${{ matrix.command }}

  security:
    name: Security review gates
    runs-on: ubuntu-latest
    needs: [changes, install-cache]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: CodeQL init
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3

  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image with registry cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    needs: [changes, build, test, security, docker]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          for result in "${{ needs.build.result }}" "${{ needs.test.result }}" "${{ needs.security.result }}" "${{ needs.docker.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required CI job finished with status: $result"
              exit 1
            fi
          done
