# pgBackRest Configuration for VeriNode-Backend
# Automated Backup & Point-in-Time Recovery (PITR) to Encrypted S3

[global]
# Repository 1: S3 Object Storage with KMS Server-Side Encryption
repo1-type=s3
repo1-s3-bucket=verinode-backups
repo1-s3-endpoint=s3.us-east-1.amazonaws.com
repo1-s3-region=us-east-1
repo1-s3-kms-key-id=arn:aws:kms:us-east-1:123456789012:key/verinode-backup-master-key
repo1-path=/backups/verinode

# AES-256 Encryption at Rest
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=env:PGBACKREST_CIPHER_PASS

# Retention Policy: Daily full retained 30 days (time-based), archive 30 days
repo1-retention-full=30
repo1-retention-full-type=time
repo1-retention-diff=7
repo1-retention-archive=30
repo1-retention-archive-type=full

# Performance & Compression
compress-type=lz4
compress-level=3
process-max=4
bundle=y

# Archiving & Recovery Timeouts (5-minute WAL RPO enforcement)
archive-async=y
archive-timeout=300
archive-push-queue-max=10GiB

# Logging & Audit
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[verinode]
pg1-path=/var/lib/postgresql/data
pg1-user=postgres
pg1-port=5432
pg1-socket-path=/var/run/postgresql
