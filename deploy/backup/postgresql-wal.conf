# PostgreSQL Continuous WAL Archiving & PITR Settings
# Guarantees RPO < 5 minutes via archive_timeout and pgBackRest push

# Archiving Configuration
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=verinode archive-push %p'

# Force a WAL switch every 300 seconds (5 minutes) if no segment has filled.
# This strictly enforces RPO < 5 minutes under low transaction volume.
archive_timeout = 300

# Standby & Recovery Defaults for Restore / PITR
restore_command = 'pgbackrest --stanza=verinode archive-get %f "%p"'
recovery_target_timeline = 'latest'

# Replication & WAL Buffer Retention
max_wal_senders = 10
wal_keep_size = 4096MB
max_wal_size = 16GB
min_wal_size = 2GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
